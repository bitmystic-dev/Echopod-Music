name: Build Pre-Release (Full Version, Custom Script)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        run: |
          echo "$KEYSTORE" | base64 --decode > test.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Get date-time string
        id: datetime
        run: |
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "date_tag=$DATE_TAG" >> $GITHUB_ENV

      - name: Resolve ffmpeg libs
        run: git clone https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ -b audio ffMetadataEx/ffmpeg-android-maker

      - name: Build full userdebug APK
        run: ./gradlew assembleFullUserdebug

      - name: Prepare APK output directory
        run: |
          mkdir -p final_output
          BUILT_APK=$(find app/build/outputs/apk/full/userdebug -name "*.apk" | head -n 1)
          cp "$BUILT_APK" "final_output/Echopod-Music-Full-Userdebug-${{ env.date_tag }}.apk"

      - name: Create GitHub release with raw APK
        env:
          GH_TOKEN: ${{ secrets.REL_TOKEN }}
          DATE_TAG: ${{ env.date_tag }}
        run: |
          gh release create "build-$DATE_TAG" final_output/*.apk \
            --target "$GITHUB_SHA" \
            --title "Build $DATE_TAG" \
            --generate-notes \
            --prerelease \
            --draft